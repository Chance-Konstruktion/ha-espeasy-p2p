name: Home Assistant Integration Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-ha:
    name: pytest-ha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test_ha.txt
      - name: Install Home Assistant test dependencies
        run: pip install -r requirements_test_ha.txt
      - name: Run integration tests against real Home Assistant
        run: python -m pytest -c pytest-ha.ini -q
