name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Keep this workflow coreless and fast. tests/conftest.py stubs the
      # small HA API surface used by the floor-plan conformance tests.
      # The separate tests_ha/ suite requires a real Home Assistant test env.
      - name: Install test dependencies
        run: pip install pytest pytest-asyncio
      - name: Run unit tests
        run: python -m pytest -q
